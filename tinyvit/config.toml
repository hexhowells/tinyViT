model_type = 'vit-small'
n_layer = 12
n_head = 12
n_embd =  768
img_size = 224
patch_size = 16

# dropout hyperparameters
embd_pdrop = 0.1
resid_pdrop = 0.1
attn_pdrop = 0.1

num_classes = 1000

[models]
vit-tiny = {n_layer=12, n_head=3, n_embd=192}   # ~5.7M params
vit-small = {n_layer=12, n_head=6, n_embd=384}  # ~22M params
vit-base = {n_layer=12, n_head=12, n_embd=768}  # ~86M params
vit-large = {n_layer=24, n_head=16, n_embd=1024} # ~307M params
vit-huge = {n_layer=32, n_head=16, n_embd=1280} # ~632M params

[data]
block_size = 128

[trainer]
device = "auto"  # "auto", "cuda", or "cpu"
batch_size = 512
accumulation_steps = 1
num_workers = 4
learning_rate = 3e-4
weight_decay = 0.3
betas = [0.9, 0.999]
grad_norm_clip = 1.0
warmup_steps = 100  # make 10% of total steps (126689 images)
epochs = 50

[mixup]
use_mixup = true
alpha = 0.2

[system]
work_dir = "./out"
data_dir = "/media/datasets/image-datasets/imagenet-100/data"